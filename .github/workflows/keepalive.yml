name: Database Keep-Alive

on:
  schedule:
    - cron: "*/4 * * * *"   # every 4 minutes — comfortably under the 5-min suspend timeout
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install sqlalchemy psycopg2-binary python-dotenv

      - name: Ping database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python apps/backend/scripts/keepalive.py